name: Bridge release

# Builds and publishes the bridge release (old domain "schulmanager", see docs/BRIDGE_RELEASE.md).
# Started by hand only: Actions → "Bridge release" → "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridge-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests on main before building
        run: |
          pip install -r requirements_test.txt
          pytest -q

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('bridge/schulmanager/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists – nothing to do."
            exit 1
          fi

      - name: Build bridge branch and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "release/$VERSION-bridge"
          python scripts/build_bridge.py --release
          git add -A custom_components
          git commit -m "Bridge release $VERSION: old domain, installs and takes over Eltern Portal Manager Bavaria" \
                     -m "Built from main $(git rev-parse --short HEAD) by the Bridge release workflow. Never merge into main."
          git tag "v$VERSION"
          git push origin "release/$VERSION-bridge" "v$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## $VERSION" 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
