name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q --cov=custom_components.eltern_portal_schulmanager --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Require full configuration-flow and diagnostics coverage
        run: python scripts/check_quality_coverage.py coverage.json
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: |
            coverage.xml
            coverage.json

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Test dashboard cards on desktop and mobile
        working-directory: tests/browser
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm test
