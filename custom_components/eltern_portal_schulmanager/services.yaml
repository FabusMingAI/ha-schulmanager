    child:
      required: true
      example: max
      selector:
        text:
    title:
      required: true
      selector:
        text:
    due:
      selector:
        date:
    amount:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          unit_of_measurement: "€"
          mode: box
    details:
      selector:
        text:
          multiline: true
    type:
      default: aufgabe
      selector:
        select:
          options: [aufgabe, zahlung, rueckmeldung, unterschrift, mitbringen, termin, lesen]
